<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102e26">
  <meta name="description" content="Croix LED et néon pour intérieur : déclinaisons, références SKU, prix en RMB et euros, caractéristiques, emballage et vidéos.">
  <title>Catalogue de croix LED et néon</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#catalogue">Aller aux produits</a>
  <main id="top">
    <nav class="collection-nav" aria-label="Catégories de produits"><a class="active" href="#led">Croix LED <span>6</span></a><a href="#neon">Croix néon <span>3</span></a></nav>
    <div id="catalogue" aria-live="polite"><p class="loading">Chargement des produits…</p></div>
  </main>
  <dialog id="viewer" aria-labelledby="viewer-title">
    <div class="viewer-header"><div><p id="viewer-product"></p><h2 id="viewer-title"></h2></div><button type="button" class="icon-button close-viewer" aria-label="Fermer la photo">✕</button></div>
    <div class="viewer-stage"><button type="button" class="icon-button viewer-prev" aria-label="Déclinaison précédente">←</button><img id="viewer-image" alt=""><button type="button" class="icon-button viewer-next" aria-label="Déclinaison suivante">→</button></div>
    <div class="viewer-bottom"><span id="viewer-position"></span><span id="viewer-price"></span></div>
  </dialog>
  <noscript><p class="no-script">Activez JavaScript pour consulter les produits. Les informations sont aussi disponibles dans <a href="catalogue.json">le fichier du catalogue</a>.</p></noscript>
</body>
</html>
